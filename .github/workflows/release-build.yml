name: Release build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - architecture: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Restore verified build assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: assets/.build-cache
          key: ${{ runner.os }}-store-assets-${{ matrix.architecture }}-sherpa-1.13.4-v1

      - name: Install Node dependencies
        run: npm ci

      - name: Build release installer
        shell: pwsh
        run: .\assets\run-store-release.ps1 -Target '${{ matrix.target }}' -Bundle nsis

      - name: Record artifact digest
        shell: pwsh
        run: |
          Get-FileHash .\release\store\${{ matrix.architecture }}\*.exe -Algorithm SHA256 |
            Format-Table Path, Hash -AutoSize

      - name: Upload installer
        id: upload-installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DictatingMe-${{ matrix.architecture }}-${{ github.ref_name }}-${{ github.sha }}
          path: release/store/${{ matrix.architecture }}/DictatingMe_*_${{ matrix.architecture }}.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      # SignPath submission is added here only after the Foundation supplies
      # the organization, project, artifact configuration, and policy IDs.

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download both installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          merge-multiple: true

      # 不用 pattern 过滤：它匹配的是 artifact 名还是内部文件名并不直观，写错了
      # 会静默下载到 0 个文件、发出一个空 release。这个 job 的上游只有 x64 和
      # arm64 两个 artifact，全下下来再显式核对数量更难出错。
      - name: Verify downloaded installers
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          echo "下载到的文件："
          ls -la
          count=$(ls -1 DictatingMe_*.exe 2>/dev/null | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::期望 2 个安装包，实际 $count 个"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for arch in x64 arm64; do
            f="DictatingMe_${version}_${arch}.exe"
            if [ ! -f "$f" ]; then
              echo "::error::缺少 $f"
              exit 1
            fi
          done

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt
          cd ..
          {
            echo "# DictatingMe ${GITHUB_REF_NAME}"
            echo
            echo "- Architectures: Windows x64 and Windows arm64"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Build provenance: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat release-assets/SHA256SUMS.txt
            echo '```'
            echo
            echo "- [Privacy policy](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/PRIVACY.md)"
            echo "- [Source archive](https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.zip)"
          } > release-notes.md

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/*.exe \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "DictatingMe ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
