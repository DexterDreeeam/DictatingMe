<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DictatingMe HUD</title>
  <link rel="stylesheet" href="./hud.css" />
</head>
<body>
  <div id="hud-stage" class="hud-stage">
    <span class="hud-ray hud-ray--left" aria-hidden="true"></span>
    <span class="hud-ray hud-ray--right" aria-hidden="true"></span>
    <div id="hud" class="hud" role="status" aria-live="polite">
      <span class="hud__light" aria-hidden="true"></span>
      <span class="hud__label">待唤醒</span>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
