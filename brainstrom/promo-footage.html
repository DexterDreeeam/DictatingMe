<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DictatingMe · 宣传视频素材</title>
<style>
  /* 产品真实配色，取自 ui/styles.css */
  :root{
    --bg:#000;
    --panel:#2b2d31;
    --panel-alt:#313338;
    --border:#3f4248;
    --text:#dbdee1;
    --text-muted:#949ba4;
    --accent:#5865f2;
    --green:#23a55a;
    --red:#f23f42;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{
    font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- 录制舞台：固定 1920x1080，缩放适配窗口 ---------- */
  #stage{
    position:absolute;left:50%;top:50%;
    width:1920px;height:1080px;
    transform-origin:center center;
    background:#000;
    overflow:hidden;
  }

  /* ---------- 控制条（录制时隐藏） ---------- */
  #hud-controls{
    position:fixed;left:0;right:0;bottom:0;z-index:9999;
    display:flex;gap:8px;align-items:center;justify-content:center;
    padding:10px 14px;background:rgba(12,13,16,.94);
    border-top:1px solid #2a2d33;
    font-size:12px;color:#9aa3b4;
  }
  #hud-controls.hidden{display:none}
  #hud-controls button{
    padding:7px 14px;border:1px solid #3a3f48;border-radius:7px;
    background:#1b1e24;color:#dbe5f8;cursor:pointer;font:inherit;font-weight:600;
  }
  #hud-controls button:hover{background:#242832;border-color:#4a515c}
  #hud-controls button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  #hud-controls select{
    padding:6px 10px;border:1px solid #3a3f48;border-radius:7px;
    background:#1b1e24;color:#dbe5f8;font:inherit;
  }
  #hud-controls .sep{width:1px;height:22px;background:#2f343c}
  kbd{
    padding:2px 6px;border:1px solid #3a3f48;border-radius:4px;
    background:#15181d;font:11px monospace;color:#aeb8ff;
  }

  /* ---------- 场景通用 ---------- */
  .scene{
    position:absolute;inset:0;
    display:grid;place-items:center;
    opacity:0;pointer-events:none;
  }
  .scene.on{opacity:1}

  /* ---------- 竖屏（?vertical=1）：1080x1920，给手机用 ----------
     不是简单缩放——横排的元素要改竖排，字号要放大，否则手机上看不清。 */
  body.vertical #stage{width:1080px;height:1920px}

  /* 三种模式：横排 -> 竖排，图标移到左侧 */
  body.vertical .modes{flex-direction:column;gap:32px}
  body.vertical .mode{
    width:900px;padding:40px 44px;text-align:left;
    display:grid;grid-template-columns:auto 1fr;
    grid-template-rows:auto auto;gap:8px 32px;align-items:center;
  }
  body.vertical .mode__icon{grid-row:1 / span 2;margin:0;width:96px;height:96px}
  body.vertical .mode__icon svg{width:52px;height:52px}
  body.vertical .mode__name{align-self:end;font-size:44px}
  body.vertical .mode__desc{align-self:start;font-size:28px}
  body.vertical .mode__desc br{display:none}

  /* 说话转文字 / 注入窗口：占满宽度，字放大 */
  body.vertical .dictate{width:990px;gap:80px}
  body.vertical .waveform{height:150px}
  body.vertical .waveform i{width:7px}
  body.vertical .typed{font-size:66px;min-height:340px}
  body.vertical .app-window{width:1000px}
  body.vertical .app-window__body{font-size:38px;min-height:520px;padding:44px}
  body.vertical .app-window__bar{padding:16px 20px}
  body.vertical .app-window__title{font-size:26px}

  /* 品牌页：logo 和字号整体放大，竖屏视野更窄 */
  body.vertical .brand{gap:38px}
  body.vertical .brand__mark{width:260px;height:260px}
  body.vertical .brand__name{font-size:104px}
  body.vertical .brand__word{width:820px}
  body.vertical .brand__tag{font-size:40px}
  body.vertical .brand__sub{font-size:28px;letter-spacing:.14em}
  body.vertical .brand__link{font-size:32px}

  /* HUD 在竖屏里要更大才看得清（横屏是 2.6） */
  body.vertical .hud-wrap{transform:scale(4.4)}

  /* 收尾页 */
  body.vertical .outro{gap:42px}
  body.vertical .outro__icon{width:160px;height:160px}
  body.vertical .outro__line{font-size:64px}
  body.vertical .outro__sub{font-size:30px}

  /* 字幕：竖屏底部留白更多，字更大 */
  body.vertical .caption{bottom:230px;gap:20px}
  body.vertical .caption__main{font-size:50px}
  body.vertical .caption__sub{font-size:34px}

  /* ---------- 静帧模式（?still=<场景>）：让所有入场动画瞬间跑完，无头浏览器截图用。
     不能写 animation:none —— 这些元素初始 opacity 就是 0，靠动画才变可见。 */
  body.still #hud-controls{display:none}
  body.still *{
    animation-duration:.001s !important;
    animation-delay:0s !important;
    transition-duration:.001s !important;
  }

  /* ---------- 标题字幕 ---------- */
  .caption{
    position:absolute;left:0;right:0;bottom:104px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    text-align:center;
    text-shadow:0 2px 18px rgba(0,0,0,.9);
    opacity:0;transition:opacity .32s var(--ease);
  }
  .caption.on{opacity:1}
  .caption__main{font-size:30px;font-weight:400;letter-spacing:.1em;color:#fff}
  .caption__sub{
    font-size:21px;font-weight:300;letter-spacing:.16em;
    color:rgba(226,229,233,.8);
  }

  /* ---------- 场景 1：品牌开场 ---------- */
  .brand{
    display:flex;flex-direction:column;align-items:center;gap:34px;
  }
  .brand__mark{
    width:230px;height:230px;
    filter:drop-shadow(0 0 46px rgba(255,255,255,.16));
    opacity:0;transform:scale(.82);
  }
  .brand.play .brand__mark{
    animation:markIn .7s var(--ease) forwards;
  }
  @keyframes markIn{to{opacity:1;transform:scale(1)}}
  /* 开场用常规字体 —— 手写体虽好看，但第一眼要让人读清楚品牌名 */
  .brand__name{
    font-size:98px;font-weight:300;letter-spacing:.1em;
    color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.6);
    opacity:0;transform:translateY(14px);
  }
  .brand.play .brand__name{animation:fadeUp .6s var(--ease) .26s forwards}
  /* 收尾用手写体字标，取自 ui/assets —— 与软件内保持一致 */
  .brand__word{
    width:560px;height:auto;display:block;
    opacity:0;transform:translateY(14px);
  }
  .brand.play .brand__word{animation:fadeUp .6s var(--ease) .26s forwards}
  .brand__link{
    font-family:Consolas,"Cascadia Mono","SF Mono",monospace;
    font-size:26px;font-weight:400;letter-spacing:.04em;
    color:rgba(232,235,239,.9);
    opacity:0;transform:translateY(12px);
  }
  .brand.play .brand__link{animation:fadeUp .6s var(--ease) .5s forwards}
  .brand__tag{
    font-size:38px;font-weight:400;letter-spacing:.16em;
    color:#fff;opacity:0;transform:translateY(12px);
  }
  .brand.play .brand__tag{animation:fadeUp .6s var(--ease) .5s forwards}
  .brand__sub{
    font-size:27px;font-weight:300;letter-spacing:.22em;
    color:rgba(219,222,225,.72);opacity:0;transform:translateY(12px);
  }
  .brand.play .brand__sub{animation:fadeUp .6s var(--ease) .72s forwards}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

  /* ---------- 场景 2：待命 HUD ---------- */
  /* 复刻 ui/hud-window/hud.css 的真实尺寸，再整体放大以适配 1080p 画面 */
  .hud-wrap{position:relative;display:grid;place-items:center;transform:scale(3.6)}
  .hud{
    position:relative;z-index:2;
    display:flex;width:126px;height:30px;
    align-items:center;justify-content:center;gap:8px;
    border:1px solid rgba(255,255,255,.08);border-radius:10px;
    background:rgba(0,0,0,.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    color:#f2f3f5;font-size:11.5px;
    transition:border-color .18s var(--ease);
  }
  .hud__light{
    width:8px;height:8px;flex:0 0 auto;border-radius:50%;
    background:#949ba4;
    transition:background-color .18s var(--ease),box-shadow .18s var(--ease);
  }
  /* 等待唤醒：黄灯 + 双层光晕（与 hud.css 的 data-light="yellow" 一致） */
  .hud--wait{border-color:rgba(240,178,50,.35)}
  .hud--wait .hud__light{
    background:#f0b232;
    box-shadow:0 0 5px #fff2a3, 0 0 12px rgba(240,178,50,.78);
  }
  /* 正在记录：绿灯，产品里没有光晕 */
  .hud--rec{border-color:rgba(35,165,90,.34)}
  .hud--rec .hud__light{background:#46e58a;box-shadow:none}
  /* 待命时的缓慢呼吸 */
  .hud--idle .hud__light{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  /* HUD 波形条 */
  .bars{display:flex;align-items:center;gap:2px;height:14px}
  .bars i{
    display:block;width:2px;height:3px;border-radius:1px;
    background:currentColor;opacity:.35;
    transition:height .07s linear,opacity .07s linear;
  }

  /* 唤醒时向两侧扩散的光带 */
  .ray{
    position:absolute;top:50%;height:2px;width:0;
    background:linear-gradient(90deg,transparent,rgba(70,229,138,.9),transparent);
    opacity:0;
  }
  .ray--l{right:50%;transform:translateY(-50%)}
  .ray--r{left:50%;transform:translateY(-50%)}
  .hud-wrap.flash .ray{animation:rayOut .85s var(--ease) forwards}
  @keyframes rayOut{
    0%{width:0;opacity:0}
    25%{opacity:1}
    100%{width:360px;opacity:0}
  }

  /* ---------- 场景 3：说话 → 文字 ---------- */
  .dictate{
    display:flex;flex-direction:column;align-items:center;gap:96px;
    width:1520px;
  }
  .waveform{
    display:flex;align-items:center;justify-content:center;gap:6px;height:160px;
  }
  .waveform i{
    display:block;width:5px;height:8px;border-radius:3px;
    background:#46e58a;opacity:.5;
    transition:height .08s linear,opacity .08s linear;
  }
  .typed{
    min-height:210px;width:100%;
    font-size:62px;font-weight:300;line-height:1.62;letter-spacing:.03em;
    text-align:center;color:#fff;
  }
  .cursor{
    display:inline-block;width:3px;height:.98em;margin-left:5px;
    background:#46e58a;vertical-align:text-bottom;
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

  /* ---------- 场景 4：注入到编辑器 ---------- */
  .app-window{
    width:1560px;border-radius:10px;overflow:hidden;
    border:1px solid var(--border);background:var(--panel);
    box-shadow:0 26px 90px rgba(0,0,0,.75);
    opacity:0;transform:translateY(20px) scale(.985);
  }
  .dictate.play .app-window,
  .inject.play .app-window{animation:fadeUp .7s var(--ease) forwards}
  /* Windows 11 风格标题栏：左侧图标+标题，右侧最小化/最大化/关闭 */
  .app-window__bar{
    display:flex;align-items:center;
    height:54px;padding-left:18px;
    background:#232529;border-bottom:1px solid var(--border);
  }
  .app-window__icon{
    width:17px;height:17px;flex:0 0 auto;color:var(--text-muted);
  }
  .app-window__title{
    margin-left:11px;font-size:13px;color:var(--text);
  }
  .app-window__spacer{flex:1}
  .win-buttons{display:flex;align-self:stretch}
  .win-buttons button{
    display:grid;place-items:center;
    width:46px;border:0;background:transparent;
    color:var(--text);cursor:default;
  }
  .win-buttons button svg{width:11px;height:11px}
  .win-buttons button:last-child:hover{background:#c42b1c;color:#fff}
  .win-buttons button:hover{background:rgba(255,255,255,.07)}
  .app-window__body{
    min-height:430px;padding:44px 52px;
    font-family:Consolas,"Cascadia Mono","Microsoft YaHei UI",monospace;
    font-size:30px;line-height:1.9;color:var(--text);
    text-align:left;
  }
  .app-window__body .cursor{height:.95em}

  /* ---------- 场景 5：三种唤醒模式 ---------- */
  .modes{display:flex;gap:34px}
  .mode{
    width:430px;padding:52px 40px;border-radius:18px;
    border:1px solid var(--border);background:var(--panel);
    text-align:center;opacity:0;transform:translateY(24px);
  }
  .modes.play .mode:nth-child(1){animation:fadeUp .5s var(--ease) .04s forwards}
  .modes.play .mode:nth-child(2){animation:fadeUp .5s var(--ease) .16s forwards}
  .modes.play .mode:nth-child(3){animation:fadeUp .5s var(--ease) .28s forwards}
  .mode__icon{
    display:grid;place-items:center;
    width:92px;height:92px;margin:0 auto 28px;border-radius:24px;
    background:rgba(88,101,242,.13);color:var(--accent);
  }
  .mode__icon svg{width:44px;height:44px}
  .mode__name{font-size:33px;font-weight:400;margin-bottom:14px;color:#fff}
  .mode__desc{font-size:21px;font-weight:300;color:var(--text-muted);line-height:1.6}

  /* ---------- 场景 6：隐私收尾 ---------- */
  .outro{display:flex;flex-direction:column;align-items:center;gap:34px}
  .outro__icon{
    width:96px;height:96px;color:var(--green);
    opacity:0;transform:scale(.85);
  }
  .outro.play .outro__icon{animation:markIn .6s var(--ease) forwards}
  .outro__line{
    font-size:42px;font-weight:200;letter-spacing:.1em;color:#fff;
    opacity:0;transform:translateY(14px);
  }
  .outro.play .outro__line{animation:fadeUp .6s var(--ease) .26s forwards}
  .outro__sub{
    font-size:20px;font-weight:300;letter-spacing:.22em;color:var(--text-muted);
    opacity:0;transform:translateY(12px);
  }
  .outro.play .outro__sub{animation:fadeUp .6s var(--ease) .48s forwards}
</style>
</head>
<body>

<div id="stage">
  <!-- 1 品牌 -->
  <section class="scene" data-scene="brand">
    <div class="brand">
      <img class="brand__mark" src="../runtime/icons/logo-dark.png" alt="" />
      <div class="brand__name">Dictating Me</div>
      <div class="brand__tag">免费开源语音输入</div>
      <div class="brand__sub">轻量运行 · 快速唤醒 · 准确转换 · 隐私安全</div>
    </div>
  </section>

  <!-- 2 待命 -->
  <section class="scene" data-scene="idle">
    <div class="hud-wrap">
      <span class="ray ray--l"></span>
      <span class="ray ray--r"></span>
      <div class="hud hud--wait hud--idle">
        <span class="hud__light"></span>
        <span class="hud__text">等待唤醒</span>
      </div>
    </div>
  </section>

  <!-- 3 唤醒 -->
  <section class="scene" data-scene="wake">
    <div class="hud-wrap">
      <span class="ray ray--l"></span>
      <span class="ray ray--r"></span>
      <div class="hud hud--rec">
        <span class="hud__light"></span>
        <span class="hud__text">正在记录</span>
      </div>
    </div>
  </section>

  <!-- 4 听写 -->
  <section class="scene" data-scene="dictate">
    <div class="dictate">
      <div class="waveform"></div>
      <div class="typed"></div>
    </div>
  </section>

  <!-- 5 注入编辑器 -->
  <section class="scene" data-scene="inject">
    <div class="inject">
      <div class="app-window">
        <div class="app-window__bar">
          <svg class="app-window__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
            <path d="M14 3v5h5"/>
          </svg>
          <span class="app-window__title">会议纪要.txt - 记事本</span>
          <span class="app-window__spacer"></span>
          <div class="win-buttons">
            <button aria-label="最小化">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1">
                <path d="M1 6h10"/>
              </svg>
            </button>
            <button aria-label="最大化">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1">
                <rect x="1.5" y="1.5" width="9" height="9" rx="0.5"/>
              </svg>
            </button>
            <button aria-label="关闭">
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.1">
                <path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="app-window__body"></div>
      </div>
    </div>
  </section>

  <!-- 6 三种模式 -->
  <section class="scene" data-scene="modes">
    <div class="modes">
      <div class="mode">
        <div class="mode__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7V5h16v2M9 19h6M12 5v14"/>
          </svg>
        </div>
        <div class="mode__name">通用文字</div>
        <div class="mode__desc">任何人说出唤醒词<br>都能唤醒</div>
      </div>
      <div class="mode">
        <div class="mode__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h2l2-6 3 12 3-9 2 5h6"/>
          </svg>
        </div>
        <div class="mode__name">语音匹配</div>
        <div class="mode__desc">比对你注册的声音<br>更少误触</div>
      </div>
      <div class="mode">
        <div class="mode__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M5 20a7 7 0 0 1 14 0"/>
          </svg>
        </div>
        <div class="mode__name">声纹验证</div>
        <div class="mode__desc">只有你本人<br>才能唤醒</div>
      </div>
    </div>
  </section>

  <!-- 7 隐私收尾 -->
  <section class="scene" data-scene="outro">
    <div class="outro">
      <svg class="outro__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6l-8-4z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <div class="outro__line">全部在本机完成</div>
      <div class="outro__sub">音频与文本不上传</div>
    </div>
  </section>

  <!-- 8 品牌回归（与开场同一构图，形成首尾呼应） -->
  <section class="scene" data-scene="endcard">
    <div class="brand">
      <img class="brand__mark" src="../runtime/icons/logo-dark.png" alt="" />
      <img class="brand__word" src="../ui/assets/dictating-me-wordmark.png" alt="Dictating Me" />
      <div class="brand__link">github.com/DexterDreeeam/DictatingMe</div>
    </div>
  </section>

  <div class="caption"></div>
</div>

<div id="hud-controls">
  <button class="primary" data-act="play">▶ 播放全片</button>
  <button data-act="stop">■ 停止</button>
  <div class="sep"></div>
  <span>单段：</span>
  <select id="jump"></select>
  <button data-act="one">播放该段</button>
  <div class="sep"></div>
  <label><input type="checkbox" id="sound" checked /> 音效</label>
  <label><input type="checkbox" id="music" checked /> 背景音乐</label>
  <label><input type="checkbox" id="speech" checked /> 配音</label>
  <div class="sep"></div>
  <span>录制时按 <kbd>H</kbd> 隐藏此栏 · <kbd>空格</kbd> 播放</span>
</div>

<script>
// ============================ 缩放适配 ============================
// 舞台是固定像素画布，靠 scale 适配窗口，这样录出来永远是标准分辨率。
// ?vertical=1 切到 1080x1920 的竖屏画布（CSS 里 body.vertical 那一段）。
const VERTICAL = new URLSearchParams(location.search).get('vertical') === '1';
if(VERTICAL) document.body.classList.add('vertical');
const STAGE_W = VERTICAL ? 1080 : 1920;
const STAGE_H = VERTICAL ? 1920 : 1080;

const stage = document.getElementById('stage');
function fitStage(){
  const scale = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
addEventListener('resize', fitStage);
fitStage();

// ============================ 音效（WebAudio 合成，无外部文件） ============================
// ?record=1 进入录制模式：隐藏控制栏、把配音接入音频总线，并暴露 __rec 给
// 外部（CDP）驱动。见 brainstrom/make-promo-video.cjs。
const REC = new URLSearchParams(location.search).get('record') === '1';
let ac = null;
let bus = null;                       // 所有声音的总线，录制时从这里分流
const soundOn = () => document.getElementById('sound').checked;
function audio(){
  if(!ac){
    ac = new (window.AudioContext || window.webkitAudioContext)();
    bus = ac.createGain();
    bus.connect(ac.destination);
  }
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
/** 音频总线。一律接这里而不是 ctx.destination，否则录制时抓不到。 */
function out(){ audio(); return bus; }
/** 单个音符。type: sine/triangle/square/sawtooth */
function tone({freq=440, dur=.15, type='sine', gain=.12, delay=0, slideTo=null}){
  if(!soundOn()) return;
  const c = audio(), t0 = c.currentTime + delay;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(g).connect(out());
  osc.start(t0); osc.stop(t0 + dur + .02);
}
/** 键盘敲击声：短促的噪声脉冲 */
function keyClick(){
  if(!soundOn()) return;
  const c = audio(), t0 = c.currentTime;
  const len = Math.floor(c.sampleRate * .022);
  const buf = c.createBuffer(1, len, c.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < len; i++){
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 1900 + Math.random() * 700; bp.Q.value = 1.1;
  const g = c.createGain(); g.gain.value = .05;
  src.connect(bp).connect(g).connect(out());
  src.start(t0);
}
const sfx = {
  boot:  () => { tone({freq:392, dur:.5, type:'sine', gain:.09}); tone({freq:587, dur:.6, type:'sine', gain:.07, delay:.1}); },
  wake:  () => { tone({freq:660, dur:.13, type:'sine', gain:.13}); tone({freq:990, dur:.28, type:'sine', gain:.1, delay:.09}); },
  listen:() => tone({freq:520, dur:.2, type:'triangle', gain:.08, slideTo:760}),
  done:  () => { tone({freq:784, dur:.16, type:'sine', gain:.11}); tone({freq:1047, dur:.34, type:'sine', gain:.085, delay:.1}); },
  swipe: () => tone({freq:300, dur:.24, type:'sine', gain:.055, slideTo:520}),
  key:   keyClick,
};

// ============================ 背景音乐 ============================
// 合成一段舒缓的循环铺底：低音持续 + 缓慢琶音。
// 全部用 WebAudio 生成，不依赖任何音频文件。
// ---------------------------- 背景音乐（抖音风格，全合成，无版权顾虑） ----------
// 128 BPM 四四拍：four-on-the-floor 底鼓 + 八分 hi-hat + 2/4 拍手 +
// Am-F-C-G 循环上的短促 pluck 动机。用 look-ahead 调度保证节奏不飘。
const bgm = (() => {
  const BPM = 128;
  const SPS = (60 / BPM) / 4;          // 每个十六分音符的秒数
  const STEPS = 16;                    // 一小节 16 步
  const CHORDS = [                     // 每小节一个和弦
    {root:110.00, notes:[440.00, 523.25, 659.25]},   // Am
    {root: 87.31, notes:[349.23, 440.00, 523.25]},   // F
    {root:130.81, notes:[523.25, 659.25, 783.99]},   // C
    {root: 98.00, notes:[392.00, 493.88, 587.33]},   // G
  ];
  const RIFF = [0,-1,1,-1, 2,-1,1,0, -1,1,-1,2, 1,-1,0,2];   // -1 = 休止

  let master = null, timer = null, step = 0, nextTime = 0, noiseBuf = null;

  function noiseSource(){
    const c = audio();
    if(!noiseBuf){
      noiseBuf = c.createBuffer(1, Math.floor(c.sampleRate * .3), c.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = c.createBufferSource();
    s.buffer = noiseBuf;
    return s;
  }
  function kick(t){
    const c = audio(), o = c.createOscillator(), g = c.createGain();
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(46, t + .09);
    g.gain.setValueAtTime(.85, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.connect(g).connect(master); o.start(t); o.stop(t + .22);
  }
  function hat(t, open){
    const c = audio(), s = noiseSource(), hp = c.createBiquadFilter(), g = c.createGain();
    hp.type = 'highpass'; hp.frequency.value = 7600;
    const dur = open ? .11 : .035;
    g.gain.setValueAtTime(open ? .10 : .14, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(hp).connect(g).connect(master); s.start(t); s.stop(t + dur + .02);
  }
  function clap(t){
    const c = audio(), s = noiseSource(), bp = c.createBiquadFilter(), g = c.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 1.1;
    g.gain.setValueAtTime(.30, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .15);
    s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t + .17);
  }
  function pluck(t, freq, gain){
    const c = audio(), o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = freq;
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(4600, t);
    lp.frequency.exponentialRampToValueAtTime(1000, t + .22);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + .006);      // 极快起音 = 弹拨感
    g.gain.exponentialRampToValueAtTime(.001, t + .3);
    o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + .32);
  }
  function bass(t, freq, dur){
    const c = audio(), o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = freq;
    lp.type = 'lowpass'; lp.frequency.value = 400; lp.Q.value = .7;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.24, t + .02);
    g.gain.setValueAtTime(.24, t + dur * .65);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(lp).connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
  }

  function tick(){
    if(!master) return;
    const c = audio();
    while(nextTime < c.currentTime + .15){          // 提前 150ms 排好
      const s = step % STEPS;
      const chord = CHORDS[Math.floor(step / STEPS) % CHORDS.length];
      if(s % 4 === 0) kick(nextTime);                     // 每拍底鼓
      if(s === 4 || s === 12) clap(nextTime);             // 2、4 拍拍手
      if(s % 2 === 0) hat(nextTime, s % 8 === 6);         // 八分 hi-hat
      if(s === 0 || s === 10) bass(nextTime, chord.root, SPS * 6);
      const r = RIFF[s];
      if(r >= 0) pluck(nextTime, chord.notes[r], .11);
      nextTime += SPS;
      step++;
    }
    timer = setTimeout(tick, 25);
  }

  return {
    start(){
      if(!document.getElementById('music').checked || master) return;
      const c = audio();
      master = c.createGain();
      master.gain.setValueAtTime(0, c.currentTime);
      master.gain.linearRampToValueAtTime(.30, c.currentTime + .7);   // 快节奏，淡入要短
      master.connect(out());
      step = 0;
      nextTime = c.currentTime + .06;
      tick();
    },
    /** 配音期间把音乐压低，让人声出得来 */
    duck(on){
      if(!master) return;
      const c = audio();
      master.gain.cancelScheduledValues(c.currentTime);
      master.gain.setValueAtTime(master.gain.value, c.currentTime);
      master.gain.linearRampToValueAtTime(on ? .10 : .30, c.currentTime + .18);
    },
    stop(){
      if(!master) return;
      const c = audio(), m = master;
      master = null;
      clearTimeout(timer); timer = null;
      m.gain.cancelScheduledValues(c.currentTime);
      m.gain.setValueAtTime(m.gain.value, c.currentTime);
      m.gain.linearRampToValueAtTime(0, c.currentTime + .8);
      setTimeout(() => { try{ m.disconnect(); }catch(_){} }, 1000);
    },
  };
})();

// ---------------------------- 配音（xtask say 合成的 wav） -------------------
// 用 <audio> 而不是 WebAudio：file:// 下 fetch+decodeAudioData 会被 CORS 拦，
// 而 HTMLAudioElement 加载同目录文件是允许的。
const voice = (() => {
  const cache = {};
  const on = () => document.getElementById('speech').checked;
  function el(name){
    if(!cache[name]){
      const a = new Audio(`promo-voice/${name}.mp3`);
      a.preload = 'auto';
      a.volume = 1.0;
      cache[name] = a;
      // 录制时配音必须走 WebAudio 总线才能被抓到。注意 createMediaElementSource
      // 会接管这个元素的输出，且同一元素只能建一次 source；file:// 下还会因为
      // 跨源污染录出静音，所以只在录制模式（走本地 http）下接。
      if(REC){
        try{ audio().createMediaElementSource(a).connect(out()); }
        catch(e){ console.warn('配音接入总线失败：', e.message); }
      }
    }
    return cache[name];
  }
  return {
    preload(){ ['wake','sentence'].forEach(el); },
    /** 播放并等它放完；关掉配音时退化成一个等长的静默等待 */
    play(name, fallbackMs){
      if(!on()) return wait(fallbackMs || 0);
      const a = el(name);
      try{ a.currentTime = 0; }catch(_){}
      bgm.duck(true);
      const p = a.play();
      if(p && p.catch) p.catch(() => {});
      return new Promise(res => {
        let done = false;
        const finish = () => {
          if(done) return;
          done = true;
          bgm.duck(false);
          res();
        };
        a.onended = finish;
        const id = setTimeout(finish, (fallbackMs || 4000) + 1500);   // 兜底
        timers.push(id);
      });
    },
    stop(){
      Object.values(cache).forEach(a => { try{ a.pause(); a.currentTime = 0; }catch(_){} });
    },
  };
})();
// ============================ 动画基础设施 ============================
let running = false;
let timers = [];
const wait = ms => new Promise(res => {
  const id = setTimeout(res, ms);
  timers.push(id);
});
function clearTimers(){
  timers.forEach(clearTimeout);
  timers = [];
}

const scenes = {};
document.querySelectorAll('[data-scene]').forEach(el => scenes[el.dataset.scene] = el);
const caption = document.querySelector('.caption');

function show(name){
  Object.values(scenes).forEach(s => {
    s.classList.remove('on');
    // 重置动画：移除 play 再强制回流
    s.querySelectorAll('.play').forEach(p => p.classList.remove('play'));
  });
  const s = scenes[name];
  s.classList.add('on');
  void s.offsetWidth;
  s.querySelectorAll('.brand,.modes,.inject,.dictate,.outro').forEach(p => p.classList.add('play'));
  return s;
}
function setCaption(main, sub){
  if(!main){ caption.classList.remove('on'); return; }
  caption.innerHTML = '';
  const m = document.createElement('span');
  m.className = 'caption__main';
  m.textContent = main;
  caption.appendChild(m);
  if(sub){
    const s = document.createElement('span');
    s.className = 'caption__sub';
    s.textContent = sub;
    caption.appendChild(s);
  }
  caption.classList.add('on');
}

/** 逐字输入，带敲击声 */
async function typeInto(el, text, {speed=68, sound=true} = {}){
  el.innerHTML = '';
  const span = document.createElement('span');
  const cur = document.createElement('span');
  cur.className = 'cursor';
  el.append(span, cur);
  for(const ch of text){
    if(!running) return;
    span.textContent += ch;
    if(sound && ch.trim()) sfx.key();
    await wait(speed + Math.random() * 34);
  }
}

/** 波形动画：返回停止函数 */
function animateBars(container, count, {min=6, max=110, speed=95} = {}){
  container.innerHTML = '';
  const bars = [];
  for(let i = 0; i < count; i++){
    const b = document.createElement('i');
    container.append(b);
    bars.push(b);
  }
  const center = (count - 1) / 2;
  let raf = null, last = 0, phase = 0;
  const tick = now => {
    if(now - last > speed){
      last = now; phase += .55;
      bars.forEach((b, i) => {
        const dist = Math.abs(i - center) / center;
        const env = 1 - dist * .72;                       // 中间高两边低
        const wob = (Math.sin(phase + i * .7) + 1) / 2;   // 平滑起伏
        const rnd = Math.random() * .5 + .5;
        const h = min + (max - min) * env * wob * rnd;
        b.style.height = h.toFixed(1) + 'px';
        b.style.opacity = (.34 + env * wob * .66).toFixed(2);
      });
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  return () => {
    cancelAnimationFrame(raf);
    bars.forEach(b => { b.style.height = '6px'; b.style.opacity = '.3'; });
  };
}

// ============================ 播放控制 ============================
async function playAll(){
  stopAll();
  running = true;
  bgm.start();
  await wait(360);                      // 留出录制起手的黑场
  for(const seg of segments){
    if(!running) return;
    await seg.run();
    if(!running) return;
    await wait(120);
  }
  await wait(600);
  bgm.stop();
  finish();
}
async function playOne(id){
  stopAll();
  running = true;
  bgm.start();
  await wait(300);
  const seg = segments.find(s => s.id === id);
  if(seg) await seg.run();
  bgm.stop();
  finish();
}
function finish(){
  running = false;
  Object.values(scenes).forEach(s => s.classList.remove('on'));
  setCaption('');
}
function stopAll(){
  running = false;
  clearTimers();
  bgm.stop();
  voice.stop();
  finish();
}
voice.preload();

// ---------------------------- 录制驱动（?record=1）----------------------------
// 由 make-promo-video.cjs 通过 CDP 调用：
//   __rec.arm()  建好录音管线并预热音频，返回后才能开始 screencast
//   __rec.run()  播放全片并同时录音，返回 base64 的 webm 音轨
if(REC){
  document.getElementById('hud-controls').style.display = 'none';
  window.__rec = {
    async arm(){
      const c = audio();
      // headless 下 AudioContext 可能是 suspended
      if(c.state !== 'running') await c.resume();
      voice.preload();
      // 等配音真正可播，否则第一段会因为还在缓冲而错位
      await Promise.all(['wake','sentence'].map(n => new Promise(res => {
        const a = new Audio(`promo-voice/${n}.mp3`);
        a.preload = 'auto';
        a.oncanplaythrough = res;
        a.onerror = res;
        setTimeout(res, 4000);
      })));
      this._dest = c.createMediaStreamDestination();
      bus.connect(this._dest);              // 并联，不影响正常输出
      return { state: c.state, sampleRate: c.sampleRate };
    },
    async run(){
      const rec = new MediaRecorder(this._dest.stream, { mimeType: 'audio/webm' });
      const chunks = [];
      rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      const stopped = new Promise(r => rec.onstop = r);
      rec.start();
      const t0 = performance.now();
      await playAll();
      const ms = performance.now() - t0;
      rec.stop();
      await stopped;
      const buf = await new Blob(chunks).arrayBuffer();
      // 二进制过不了 CDP，转 base64
      let s = '';
      const b = new Uint8Array(buf);
      for(let i = 0; i < b.length; i += 0x8000){
        s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
      }
      return { durationMs: ms, audioB64: btoa(s), bytes: buf.byteLength };
    },
  };
}

// ---------------------------- 静帧模式 --------------------------------------
// ?still=<场景 id> 直接定格该场景的终态，不播动画、不出声、不显示控制栏。
// README 的配图就是无头浏览器访问这些地址截出来的。
(function still(){
  const q = new URLSearchParams(location.search);
  const want = q.get('still');
  if(!want) return;
  const s = scenes[want];
  if(!s){
    console.warn(`未知场景 '${want}'，可选：${Object.keys(scenes).join(', ')}`);
    return;
  }
  // 字幕是绝对定位在画面底部的，做静态配图时会在中间留一大片空白，
  // 所以 README 那批截图用 nocap=1 关掉它。
  const cap = q.get('nocap') === '1' ? () => {} : setCaption;
  document.body.classList.add('still');
  show(want);
  // 有些场景的内容是播放过程中填进去的，静帧要补上
  if(want === 'wake'){
    s.querySelector('.hud-wrap')?.classList.add('flash');   // 两侧唤醒光线
    cap('“小迪小迪”', '支持全自定义唤醒词');
  }
  if(want === 'dictate'){
    const t = s.querySelector('.typed');
    if(t) t.textContent = DEMO_TEXT;
    animateBars(s.querySelector('.waveform'), 34);
    cap('开口说话，文字实时出现');
  }
  if(want === 'inject'){
    const b = s.querySelector('.app-window__body');
    if(b) b.textContent = INJECT_TEXT;
    cap('文字直接落进你正在用的窗口');
  }
  if(want === 'modes') cap('三种唤醒方式，按需选择');
  // 告诉截图脚本可以下快门了
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.dataset.stillReady = '1';
  }));
})();
</script>
